<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Past Sessions</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <style>
      .sessions-container {
        display: flex;
        padding: 20px;
        gap: 20px;
        margin-top: 80px; /* Add this line for spacing below navbar */
      }

      .sessions-list {
        flex: 1;
        max-width: 300px;
        background: var(--bg-secondary);
        padding: 20px;
        border-radius: 8px;
      }

      .session-item {
        padding: 15px;
        margin: 8px 0;
        background: var(--bg-primary);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        border: 2px solid transparent;
      }

      .session-item:hover {
        background: var(--bg-primary);
        border-color: var(--accent-color);
        opacity: 0.5;
      }

      .session-item.active {
        background: var(--accent-color);
        color: var(--accent-color);
      }

      .session-name {
        font-weight: bold;
        margin-bottom: 5px;
      }

      .session-time {
        font-size: 0.9em;
        color: var(--text-secondary);
      }

      .no-data-message {
        text-align: center;
        padding: 20px;
        color: var(--text-secondary);
      }

      .no-selection {
        text-align: center;
        font-size: 1.2em;
        padding: 40px;
        color: var(--text-secondary);
      }

      .charts-container {
        flex: 3;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .chart-wrapper {
        background: var(--bg-secondary);
        padding: 20px;
        border-radius: 8px;
      }

      .nav-button {
        padding: 8px 16px;
        background-color: var(--button-bg);
        border: 1px solid var(--button-border);
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
        color: var(--text-color);
      }

      .nav-button:hover {
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-brand"><a href="index.html">FitSync</a></div>
      <div class="nav-right">
        <div class="nav-links">
          <button
            class="nav-button"
            onclick="window.location.href='dashboard.html'"
          >
            Live Dashboard
          </button>
          <button class="signout-button">Sign Out</button>
        </div>
        <div class="theme-toggle" id="themeToggle">☀️</div>
      </div>
    </nav>

    <div class="sessions-container">
      <div class="sessions-list">
        <h2>Past Sessions</h2>
        <div id="sessionsList">
          <!-- Sessions will be populated here -->
        </div>
      </div>

      <div id="chartSection">
        <div id="noSelectionMessage" class="no-selection">
          Select a session to continue
        </div>
        <div id="charts" class="charts-container" style="display: none">
          <div class="chart-wrapper">
            <canvas id="anomalyChart"></canvas>
          </div>
          <div class="chart-wrapper">
            <canvas id="inputChart"></canvas>
          </div>
          <div class="chart-wrapper">
            <canvas id="predictedChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Theme toggle functionality
      const themeToggle = document.getElementById("themeToggle");
      const root = document.documentElement;

      // Check for saved preference
      const currentTheme = localStorage.getItem("theme") || "light";
      root.setAttribute("data-theme", currentTheme);
      themeToggle.textContent = currentTheme === "dark" ? "🌙" : "☀️";

      themeToggle.addEventListener("click", () => {
        const newTheme =
          root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        themeToggle.textContent = newTheme === "dark" ? "🌙" : "☀️";

        // Update chart themes
        [anomalyChart, inputChart, predictedChart].forEach((chart) => {
          chart.options.scales.x.grid.color =
            newTheme === "dark" ? "#404040" : "#ddd";
          chart.options.scales.y.grid.color =
            newTheme === "dark" ? "#404040" : "#ddd";
          chart.options.scales.x.ticks.color =
            newTheme === "dark" ? "#fff" : "#666";
          chart.options.scales.y.ticks.color =
            newTheme === "dark" ? "#fff" : "#666";
          chart.update();
        });
      });

      // Placeholder data for sessions
      const mockSessions = [
        { id: 1, timestamp: "2024-01-20T09:30:00" },
        { id: 2, timestamp: "2024-01-19T16:45:00" },
        { id: 3, timestamp: "2024-01-18T07:15:00" },
        { id: 4, timestamp: "2024-01-17T18:20:00" },
        { id: 5, timestamp: "2024-01-16T14:00:00" },
      ];

      const formatSessionDate = (timestamp) => {
        const date = new Date(timestamp);
        return {
          date: date.toLocaleDateString("en-US", {
            weekday: "short",
            month: "short",
            day: "numeric",
          }),
          time: date.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
          }),
        };
      };

      // Modified fetch and display sessions function
      const fetchSessions = async () => {
        try {
          // Using mock data instead of API call for now
          const sessions = mockSessions;

          const sessionsList = document.getElementById("sessionsList");
          if (sessions.length === 0) {
            sessionsList.innerHTML = `
              <div class="no-data-message">No workout sessions found</div>
            `;
            return;
          }

          sessionsList.innerHTML = sessions
            .map((session) => {
              const { date, time } = formatSessionDate(session.timestamp);
              return `
              <div class="session-item" data-session-id="${session.id}">
                <div class="session-name">Workout on ${date}</div>
                <div class="session-time">Started at ${time}</div>
              </div>
            `;
            })
            .join("");
        } catch (error) {
          console.error("Failed to fetch sessions:", error);
        }
      };

      // Load session data when clicked
      const loadSessionData = async (sessionId) => {
        try {
          // Placeholder for API call
          const response = await fetch(`/api/sessions/${sessionId}`);
          const sessionData = await response.json();

          // Update charts with session data
          updateCharts(sessionData);
        } catch (error) {
          console.error("Failed to load session data:", error);
        } finally {
          // Hide no selection message and display charts
          document.getElementById("noSelectionMessage").style.display = "none";
          document.getElementById("charts").style.display = "flex";
        }
      };

      // Modified event listener for session selection
      document.getElementById("sessionsList").addEventListener("click", (e) => {
        const sessionItem = e.target.closest(".session-item");
        if (sessionItem) {
          // Remove active class from all items
          document.querySelectorAll(".session-item").forEach((item) => {
            item.classList.remove("active");
          });
          // Add active class to clicked item
          sessionItem.classList.add("active");

          const sessionId = sessionItem.dataset.sessionId;
          loadSessionData(sessionId);
        }
      });

      // Initialize charts with same configuration as dashboard
      const initializeCharts = () => {
        const ctx = document.getElementById("anomalyChart").getContext("2d");
        anomalyChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [], // Time labels
            datasets: [
              {
                label: "Anomaly Score",
                data: [],
                borderColor: "red",
                backgroundColor: "rgba(255, 0, 0, 0.2)",
                borderWidth: 2,
              },
            ],
          },
          options: {
            scales: {
              x: {
                title: { display: true, text: "Time (s)" },
                ticks: { maxTicksLimit: 20 },
              },
              y: {
                title: { display: true, text: "Anomaly (0 or 1)" },
                min: 0,
                max: 1,
                ticks: { stepSize: 1 },
              },
            },
          },
        });

        const inputCtx = document.getElementById("inputChart").getContext("2d");
        inputChart = new Chart(inputCtx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Input HR",
                data: [],
                borderColor: "blue",
                backgroundColor: "rgba(0, 0, 255, 0.2)",
                borderWidth: 2,
              },
            ],
          },
          options: {
            scales: {
              x: {
                title: { display: true, text: "Time (s)" },
                ticks: { minTicksLimit: 20 },
              },
              y: { title: { display: true, text: "Heart Rate (BPM)" } },
            },
          },
        });

        const predictedCtx = document
          .getElementById("predictedChart")
          .getContext("2d");
        predictedChart = new Chart(predictedCtx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Predicted HR",
                data: [],
                borderColor: "green",
                backgroundColor: "rgba(0, 255, 0, 0.2)",
                borderWidth: 2,
              },
            ],
          },
          options: {
            scales: {
              x: {
                title: { display: true, text: "Time (s)" },
                ticks: { maxTicksLimit: 20 },
              },
              y: { title: { display: true, text: "Heart Rate (BPM)" } },
            },
          },
        });
      };

      const updateCharts = (sessionData) => {
        // Update anomaly chart
        anomalyChart.data.labels = sessionData.timeLabels;
        anomalyChart.data.datasets[0].data = sessionData.anomalyScores;
        anomalyChart.update();

        // Update input chart
        inputChart.data.labels = sessionData.timeLabels;
        inputChart.data.datasets[0].data = sessionData.inputHR;
        inputChart.update();

        // Update predicted chart
        predictedChart.data.labels = sessionData.timeLabels;
        predictedChart.data.datasets[0].data = sessionData.predictedHR;
        predictedChart.update();
      };

      // Sign out functionality
      document
        .querySelector(".signout-button")
        .addEventListener("click", () => {
          localStorage.removeItem("token");
          alert("You have been signed out.");
          window.location.href = "index.html";
        });

      // Initialize page
      initializeCharts();
      fetchSessions();
    </script>
  </body>
</html>
